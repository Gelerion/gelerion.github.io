{{ define "main" }}
  <div class="container" role="main">
    <div class="row">
      <div class="col-lg-8 offset-lg-2 col-md-10 offset-md-1">
        {{ with .Content }}
          <div class="content-section">
            {{.}}
          </div>
        {{ end }}
        <div class="posts-list">
          {{ $pag := partial "func/paginate.html" . }}
          {{ range $pag.Pages }}
            <div class="post-item-compact">
              <span class="post-date-compact">{{ .Date.Format "02 Jan 2006" }}</span>
              <a href="{{ .Permalink }}" class="post-title-compact">{{ .Title }}</a>
            </div>
          {{ end }}
        </div>
        {{ partial "paginator.html" . }}
      </div>
    </div>
  </div>
{{ end }}
