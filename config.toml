baseURL = 'https://gelerion.github.io/'
locale = 'en-us'
title = 'Gelerion Blog'
theme = 'beautifulhugo'
description = "Notes on software architecture, distributed systems, and production AI engineering"
keywords = [
  "software architecture",
  "AI agents",
  "AI agent architecture",
  "AI agent security",
  "agent memory",
  "RAG",
  "LLM applications",
  "data engineering",
  "stream processing",
  "observability"
]

enableRobotsTXT = true 
enableGitInfo = true
summaryLength = 70

# Shown in the side menu
copyright = "&copy; Denis Shuvalov. All rights reserved."
canonifyurls = true

[module.hugoVersion]
  min = "0.169.0"

# Use a hand-written `lastmod` when present; otherwise it falls back to the post
# date, so the theme hides "Last modified" for posts that were never updated
[frontmatter]
  lastmod = ["lastmod", "date"]


[params]
  subtitle = "Practical notes on software architecture, security, and AI engineering"
  brand = "Gelerion"
  dateFormat = "02 Jan 2006"
  favicon = "favicon.ico"
  mainSections = ["posts"]
  colorScheme = "auto"   # "light" | "dark" | "auto"; v5 ships its own toggle

  comments = true
  readingTime = true
  hideAuthor = true
  wordCount = false
  #useHLJS = true
  socialShare = true
  showRelatedPosts = true

  [params.search]
    provider = "fuse"   # navbar search overlay, backed by the home page JSON output

  [params.giscus]
    repo = "Gelerion/gelerion.github.io"
    repoId = "MDEwOlJlcG9zaXRvcnkyMDk5NjA3Njk="
    category = "Comments"
    categoryId = "DIC_kwDODIO_Qc4DKpwT"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"

[related]
  threshold = 80 # Lower score means more matches (default 80)
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100 
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "series"
    weight = 120 

[pagination]
  pagerSize = 10
 
[params.author]
  # Set only your "username" for default hosts and full URLs otherwise (e.g., "https://MyGitLab.org/username")
  name = "Denis Shuvalov"
  website = "https://gelerion.github.io/"
  #email = "youremail@domain.com"
  github = "Gelerion"
  linkedin = "denisshuvalov"
  stackoverflow = "users/6350670/gelerion"

# https://gohugo.io/content-management/taxonomies/
[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = "series"


[menu]
  # Shown in the side menu.
  [[menu.main]]
    name = "Home"
    weight = 1
    identifier = "home"
    url = "/"
  [[menu.main]]
    name = "Posts"
    weight = 2
    identifier = "posts"
    url = "/posts/"
  [[menu.main]]
    name = "Series"
    weight = 3
    identifier = "series"
    url = "/series/"
  [[menu.main]]
    name = "Tags"
    weight = 4
    identifier = "tags"
    url = "/tags/"
  [[menu.main]]
    name = "About"
    weight = 5
    identifier = "about"
    url = "/about/"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    noHl = false
    style = 'github'
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false   # lets the theme's image render hook see ![]() attributes
    [markup.goldmark.renderer]
      unsafe = true
      
[services]
  [services.googleAnalytics]
    id = "G-962FFPME5F"

[outputs]
  home    = ["HTML", "RSS", "JSON"]   # RSS for readers, JSON for search
  section = ["HTML", "RSS"]

# Optional lightweight search for a static site
[outputFormats.JSON]
  mediaType = "application/json"
  baseName  = "index"

[minify]
  disableXML = true         

[development]
  buildDrafts = true
  buildFuture = true

#demo: https://hugo-theme-beautifulhugo.netlify.app/